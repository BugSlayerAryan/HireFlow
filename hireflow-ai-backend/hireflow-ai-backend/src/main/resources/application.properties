
# Deploy testing / Database Deploy testing

spring.application.name=hireflow-ai-backend

# ===============================
# SERVER
# ===============================

server.port=${PORT:${SERVER_PORT:8081}}


# ===============================
# DATABASE
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# API ERRORS
# ===============================

server.error.include-message=always
server.error.include-binding-errors=always


# ===============================
# GEMINI AI
# ===============================

gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}


# ===============================
# FILE UPLOADS
# ===============================

hireflow.upload.dir=${HIREFLOW_UPLOAD_DIR:uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# ===============================
# WEBSOCKET
# ===============================

websocket.endpoint=/ws-hireflow


# ===============================
# LOGGING
# ===============================

logging.level.root=INFO
logging.level.org.springframework.security=INFO